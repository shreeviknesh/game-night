/* =====================================================================
 * EXPORT — render the final scorecard to a PNG via canvas.
 * Uses Web Share API on mobile when available, else triggers a download.
 * ===================================================================== */
function exportFinalCard(){
  if (!state) return;
  const canvas = renderScorecardCanvas();
  const filename = `yahtzee-${new Date().toISOString().slice(0,10)}.png`;
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    // Try native share with file (mobile)
    try{
      const file = new File([blob], filename, {type:"image/png"});
      if (navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:"Yahtzee Final Score"});
        return;
      }
    }catch(e){ /* fallthrough to download */ }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast("Exported to your Downloads", "success");
  }, "image/png");
}

function renderScorecardCanvas(){
  const sorted = [...state.players].sort((a,b) => grandTotal(b) - grandTotal(a));
  const winner = sorted[0];

  // Layout constants
  const dpr = Math.max(2, window.devicePixelRatio || 1);
  const W = 900;
  const PAD = 36;
  const HEADER_H = 130;
  const PODIUM_ROW_H = 44;
  const PODIUM_H = 24 + sorted.length * (PODIUM_ROW_H + 6) + 18;
  const COL_LABEL_W = 220;
  const N = state.players.length;
  const COL_W = (W - PAD*2 - COL_LABEL_W) / N;
  const ROW_H = 32;
  const SECTION_HEAD_H = 26;
  const NUM_ROWS = 13 + 4; // 13 cats + upper subtotal + bonus + lower subtotal + grand
  // also yahtzee bonus row if any
  const showYBonus = state.players.some(p => (p.yahtzeeBonus||0) > 0);
  const totalRows = 6 /*upper*/ + 7 /*lower*/ + (showYBonus?1:0) + 4 /*upperSub, bonus, lowerSub, grand*/;
  const TABLE_H = SECTION_HEAD_H*2 + totalRows*ROW_H + ROW_H /*head*/ + 16;
  const FOOTER_H = 60;
  const H = HEADER_H + PODIUM_H + TABLE_H + FOOTER_H + PAD*2;

  const canvas = document.createElement("canvas");
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W+"px"; canvas.style.height = H+"px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.textBaseline = "middle";

  // Background gradient
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0, "#0c0c18");
  bg.addColorStop(0.5, "#0a0a14");
  bg.addColorStop(1, "#08080f");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // Glow blobs
  ctx.save();
  const g1 = ctx.createRadialGradient(W*0.15, 80, 10, W*0.15, 80, 480);
  g1.addColorStop(0, "rgba(139,92,246,0.35)");
  g1.addColorStop(1, "rgba(139,92,246,0)");
  ctx.fillStyle = g1; ctx.fillRect(0,0,W,H);
  const g2 = ctx.createRadialGradient(W*0.95, H*0.4, 10, W*0.95, H*0.4, 520);
  g2.addColorStop(0, "rgba(34,211,238,0.22)");
  g2.addColorStop(1, "rgba(34,211,238,0)");
  ctx.fillStyle = g2; ctx.fillRect(0,0,W,H);
  ctx.restore();

  // Outer card
  const cardX = PAD, cardY = PAD, cardW = W-PAD*2, cardH = H-PAD*2;
  roundRect(ctx, cardX, cardY, cardW, cardH, 22);
  ctx.fillStyle = "rgba(255,255,255,0.025)";
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  ctx.lineWidth = 1; ctx.stroke();

  // ===== Header =====
  let y = cardY + 28;
  // Brand mark
  const brandX = cardX + 28, brandY = y;
  const grad = ctx.createLinearGradient(brandX, brandY, brandX+44, brandY+44);
  grad.addColorStop(0, "#8b5cf6"); grad.addColorStop(1, "#22d3ee");
  roundRect(ctx, brandX, brandY, 44, 44, 12); ctx.fillStyle = grad; ctx.fill();
  // dots
  ctx.fillStyle = "rgba(255,255,255,0.95)";
  [[14,14],[30,14],[22,22],[14,30],[30,30]].forEach(([dx,dy]) => {
    ctx.beginPath(); ctx.arc(brandX+dx, brandY+dy, 2.4, 0, Math.PI*2); ctx.fill();
  });

  ctx.fillStyle = "#f5f5fa";
  ctx.font = "700 22px -apple-system, 'SF Pro Display', Inter, system-ui, sans-serif";
  ctx.fillText("Yahtzee · Final Score", brandX + 60, brandY + 14);
  ctx.fillStyle = "rgba(245,245,250,0.5)";
  ctx.font = "500 12px -apple-system, 'SF Pro Display', Inter, system-ui, sans-serif";
  const dt = new Date(state.startedAt || Date.now());
  const dateStr = dt.toLocaleDateString(undefined, {year:"numeric",month:"short",day:"numeric"});
  ctx.fillText(`${dateStr} · ${state.players.length} players · ${state.gameOver?"completed":"in progress"}`, brandX + 60, brandY + 32);

  // Champion banner (right side of header)
  const banW = 320, banH = 80;
  const banX = cardX + cardW - banW - 28, banY = brandY - 4;
  const bg2 = ctx.createLinearGradient(banX, banY, banX+banW, banY+banH);
  bg2.addColorStop(0, "rgba(251,191,36,0.18)");
  bg2.addColorStop(1, "rgba(139,92,246,0.18)");
  roundRect(ctx, banX, banY, banW, banH, 16);
  ctx.fillStyle = bg2; ctx.fill();
  ctx.strokeStyle = "rgba(251,191,36,0.35)"; ctx.lineWidth = 1; ctx.stroke();

  ctx.fillStyle = "rgba(245,245,250,0.55)";
  ctx.font = "600 10px -apple-system, system-ui, sans-serif";
  ctx.fillText("CHAMPION", banX + 18, banY + 18);
  ctx.fillStyle = "#fbbf24";
  ctx.font = "800 24px -apple-system, system-ui, sans-serif";
  const wname = truncate(ctx, winner.name, banW - 130);
  ctx.fillText(wname, banX + 18, banY + 42);
  ctx.fillStyle = "rgba(245,245,250,0.7)";
  ctx.font = "500 12px -apple-system, system-ui, sans-serif";
  ctx.fillText(`${grandTotal(winner)} pts`, banX + 18, banY + 64);

  // Trophy icon
  ctx.save();
  ctx.translate(banX + banW - 64, banY + 22);
  ctx.fillStyle = "rgba(251,191,36,0.85)";
  ctx.font = "700 36px -apple-system, system-ui, sans-serif";
  ctx.textBaseline = "top";
  ctx.fillText("🏆", 0, 0);
  ctx.restore();
  ctx.textBaseline = "middle";

  y = brandY + 80;

  // ===== Podium =====
  ctx.fillStyle = "rgba(245,245,250,0.45)";
  ctx.font = "600 11px -apple-system, system-ui, sans-serif";
  ctx.fillText("FINAL STANDINGS", cardX + 28, y);
  y += 18;

  sorted.forEach((p, i) => {
    const rx = cardX + 28, ry = y, rw = cardW - 56, rh = PODIUM_ROW_H;
    const isFirst = i === 0;
    roundRect(ctx, rx, ry, rw, rh, 12);
    if (isFirst){
      const gr = ctx.createLinearGradient(rx,ry,rx+rw,ry);
      gr.addColorStop(0, hexToRgba(p.color, 0.18));
      gr.addColorStop(1, "rgba(251,191,36,0.18)");
      ctx.fillStyle = gr; ctx.fill();
      ctx.strokeStyle = "rgba(251,191,36,0.45)";
    } else {
      ctx.fillStyle = hexToRgba(p.color, 0.06);
      ctx.fill();
      ctx.strokeStyle = hexToRgba(p.color, 0.25);
    }
    ctx.lineWidth = 1; ctx.stroke();

    // Rank
    roundRect(ctx, rx + 10, ry + 8, 28, 28, 8);
    ctx.fillStyle = isFirst ? "#fbbf24" : "rgba(255,255,255,0.06)";
    ctx.fill();
    ctx.fillStyle = isFirst ? "#1a1410" : "rgba(245,245,250,0.7)";
    ctx.font = "700 14px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(i+1), rx + 24, ry + 22);
    ctx.textAlign = "left";

    // Color dot
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(rx + 52, ry + 22, 4.5, 0, Math.PI*2); ctx.fill();

    // Name
    ctx.fillStyle = "#f5f5fa";
    ctx.font = "600 14px -apple-system, system-ui, sans-serif";
    ctx.fillText(truncate(ctx, p.name, rw - 220), rx + 64, ry + 22);

    // Score (right aligned)
    ctx.textAlign = "right";
    if (isFirst){
      const lg = ctx.createLinearGradient(rx+rw-150, 0, rx+rw, 0);
      lg.addColorStop(0, "#fbbf24"); lg.addColorStop(1, "#fcd34d");
      ctx.fillStyle = lg;
    } else {
      ctx.fillStyle = "#f5f5fa";
    }
    ctx.font = "800 20px -apple-system, system-ui, sans-serif";
    ctx.fillText(String(grandTotal(p)), rx + rw - 16, ry + 22);
    ctx.textAlign = "left";

    y += rh + 6;
  });
  y += 10;

  // ===== Scorecard table =====
  const tableX = cardX + 28;
  const tableW = cardW - 56;
  const labelW = 200;
  const numCols = state.players.length;
  const colW = (tableW - labelW) / numCols;

  // Player header row
  const headY = y;
  ctx.fillStyle = "rgba(255,255,255,0.025)";
  roundRect(ctx, tableX, headY, tableW, ROW_H, 8); ctx.fill();
  ctx.fillStyle = "rgba(245,245,250,0.5)";
  ctx.font = "600 11px -apple-system, system-ui, sans-serif";
  ctx.fillText("CATEGORY", tableX + 14, headY + ROW_H/2);
  state.players.forEach((p, i) => {
    const cx = tableX + labelW + colW*i + colW/2;
    // dot
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(cx - measureName(ctx, p.name)/2 - 8, headY + ROW_H/2, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#f5f5fa";
    ctx.font = "600 12px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(truncate(ctx, p.name, colW - 20), cx, headY + ROW_H/2);
    ctx.textAlign = "left";
  });
  y = headY + ROW_H + 4;

  // Helper to render a row
  function drawRow(label, hint, getValue, opts={}){
    const ry = y;
    if (opts.bg){
      ctx.fillStyle = opts.bg;
      roundRect(ctx, tableX, ry, tableW, ROW_H, 6); ctx.fill();
    } else if ((opts.alt|0) % 2){
      ctx.fillStyle = "rgba(255,255,255,0.015)";
      ctx.fillRect(tableX, ry, tableW, ROW_H);
    }
    ctx.fillStyle = opts.labelColor || "rgba(245,245,250,0.85)";
    ctx.font = (opts.bold ? "700" : "500") + " 12px -apple-system, system-ui, sans-serif";
    ctx.fillText(label, tableX + 14, ry + ROW_H/2);
    if (hint){
      ctx.fillStyle = "rgba(245,245,250,0.32)";
      ctx.font = "400 10px -apple-system, system-ui, sans-serif";
      ctx.fillText(hint, tableX + 14 + measureLabel(ctx, label, opts.bold) + 8, ry + ROW_H/2 + 1);
    }
    state.players.forEach((p, i) => {
      const cx = tableX + labelW + colW*i + colW/2;
      const v = getValue(p);
      ctx.fillStyle = opts.cellColor || (v === null || v === "·" ? "rgba(245,245,250,0.25)" : "#f5f5fa");
      ctx.font = (opts.bold ? "700" : "600") + " 13px ui-monospace, 'SF Mono', monospace";
      ctx.textAlign = "center";
      ctx.fillText(v === null ? "·" : String(v), cx, ry + ROW_H/2);
      ctx.textAlign = "left";
    });
    y += ROW_H;
  }

  // Section header
  function drawSectionHead(label){
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.font = "600 10px -apple-system, system-ui, sans-serif";
    ctx.fillText(label.toUpperCase(), tableX + 14, y + SECTION_HEAD_H/2);
    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.beginPath();
    ctx.moveTo(tableX + labelW - 6, y + SECTION_HEAD_H - 4);
    ctx.lineTo(tableX + tableW - 6, y + SECTION_HEAD_H - 4);
    ctx.stroke();
    y += SECTION_HEAD_H;
  }

  drawSectionHead("Upper Section");
  CATEGORIES.filter(c => c.section === "upper").forEach((c, i) => {
    drawRow(c.name, c.hint, p => p.scores[c.key], {alt:i});
  });
  drawRow("Upper Subtotal", "", p => upperTotal(p), {bg:"rgba(255,255,255,0.03)", bold:true});
  drawRow("Upper Bonus", "63+ → +35", p => upperTotal(p) >= 63 ? "+35" : `${upperTotal(p)}/63`, {labelColor:"rgba(245,245,250,0.55)"});

  drawSectionHead("Lower Section");
  CATEGORIES.filter(c => c.section === "lower").forEach((c, i) => {
    drawRow(c.name, c.hint, p => p.scores[c.key], {alt:i});
  });

  if (showYBonus){
    drawRow("Yahtzee Bonus", "+100 each", p => (p.yahtzeeBonus||0) > 0 ? `+${p.yahtzeeBonus}` : "·", {labelColor:"#fcd34d"});
  }
  drawRow("Lower Subtotal", "", p => lowerTotal(p), {bg:"rgba(255,255,255,0.03)", bold:true});

  // Grand total
  const gy = y;
  const ggrad = ctx.createLinearGradient(tableX, gy, tableX+tableW, gy);
  ggrad.addColorStop(0, "rgba(251,191,36,0.10)");
  ggrad.addColorStop(1, "rgba(139,92,246,0.10)");
  ctx.fillStyle = ggrad;
  roundRect(ctx, tableX, gy, tableW, ROW_H + 8, 10); ctx.fill();
  ctx.strokeStyle = "rgba(251,191,36,0.25)"; ctx.lineWidth = 1; ctx.stroke();

  ctx.fillStyle = "#fcd34d";
  ctx.font = "800 14px -apple-system, system-ui, sans-serif";
  ctx.fillText("Grand Total", tableX + 14, gy + (ROW_H+8)/2);
  state.players.forEach((p, i) => {
    const cx = tableX + labelW + colW*i + colW/2;
    const isWinner = grandTotal(p) === grandTotal(winner);
    if (isWinner){
      const sg = ctx.createLinearGradient(cx-30, 0, cx+30, 0);
      sg.addColorStop(0, "#fbbf24"); sg.addColorStop(1, "#fcd34d");
      ctx.fillStyle = sg;
    } else {
      ctx.fillStyle = "#f5f5fa";
    }
    ctx.font = "800 16px ui-monospace, 'SF Mono', monospace";
    ctx.textAlign = "center";
    ctx.fillText(String(grandTotal(p)), cx, gy + (ROW_H+8)/2);
    ctx.textAlign = "left";
  });
  y = gy + ROW_H + 8 + 10;

  // ===== Footer =====
  const hmUsers = state.players.filter(p => p.hailMaryUsed);
  if (hmUsers.length){
    ctx.fillStyle = "rgba(251,191,36,0.55)";
    ctx.font = "500 11px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "center";
    const names = hmUsers.map(p => p.name).join(", ");
    ctx.fillText(`Hail Mary used by: ${names}`, W/2, cardY + cardH - 44);
  }
  ctx.fillStyle = "rgba(245,245,250,0.3)";
  ctx.font = "500 11px -apple-system, system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("yahtzee tracker · scored by hand · played with friends", W/2, cardY + cardH - 28);
  ctx.textAlign = "left";

  return canvas;
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}
function hexToRgba(hex, a){
  const m = hex.replace("#","");
  const r = parseInt(m.slice(0,2),16);
  const g = parseInt(m.slice(2,4),16);
  const b = parseInt(m.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function truncate(ctx, text, maxW){
  if (ctx.measureText(text).width <= maxW) return text;
  let s = text;
  while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0,-1);
  return s + "…";
}
function measureName(ctx, name){
  ctx.save();
  ctx.font = "600 12px -apple-system, system-ui, sans-serif";
  const w = ctx.measureText(name).width;
  ctx.restore();
  return w;
}
function measureLabel(ctx, label, bold){
  ctx.save();
  ctx.font = (bold?"700":"500") + " 12px -apple-system, system-ui, sans-serif";
  const w = ctx.measureText(label).width;
  ctx.restore();
  return w;
}

function showWinnerModal(){
  closeModal();
  $modalRoot.classList.add("open");
  const sorted = [...state.players].sort((a,b) => grandTotal(b) - grandTotal(a));
  const winner = sorted[0];

  const podiumHtml = sorted.map((p, i) => `
    <div class="podium-row ${i === 0 ? "first" : ""}" style="--pc:${p.color};--pc-glow:${p.glow}">
      <div class="podium-rank">${i+1}</div>
      <div class="podium-name"><span class="dot"></span>${escapeHtml(p.name)}</div>
      <div class="podium-score">${grandTotal(p)}</div>
    </div>
  `).join("");

  $modalRoot.innerHTML = `
    <div class="modal-backdrop"></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="winner-banner">
        <div class="winner-label">Champion</div>
        <div class="winner-name">${escapeHtml(winner.name)}</div>
        <div class="winner-score"><b>${grandTotal(winner)}</b> points</div>
      </div>
      <div class="winner-podium">${podiumHtml}</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-act="close" style="flex:0 0 auto;padding:11px 18px">Review</button>
        <button class="btn btn-ghost" data-act="export" style="flex:0 0 auto;padding:11px 16px">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export
        </button>
        <button class="btn btn-primary" data-act="new" style="flex:0 0 auto;padding:11px 18px;--pc:#fbbf24;--pc-glow:rgba(251,191,36,0.45)">Play Again</button>
      </div>
    </div>`;
  $modalRoot.querySelector(".modal-backdrop").addEventListener("click", closeModal);
  $modalRoot.querySelector('[data-act="close"]').addEventListener("click", closeModal);
  $modalRoot.querySelector('[data-act="export"]').addEventListener("click", exportFinalCard);
  $modalRoot.querySelector('[data-act="new"]').addEventListener("click", () => { closeModal(); newGame(); });
}

/* =====================================================================
 * TOASTS
 * ===================================================================== */
const $toasts = document.getElementById("toasts");
function showToast(text, kind=""){
  const el = document.createElement("div");
  el.className = "toast " + (kind||"");
  el.textContent = text;
  $toasts.appendChild(el);
  setTimeout(()=>el.remove(), 2900);
}

/* =====================================================================
 * UTILS
 * ===================================================================== */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
}

/* =====================================================================
 * KEYBOARD
 * ===================================================================== */
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (!state) return;
  const key = e.key.toLowerCase();
  if (key >= "1" && key <= "6"){
    e.preventDefault();
    addDieValue(parseInt(key,10));
  } else if (key === "z"){
    e.preventDefault();
    undo();
  } else if (key === "r"){
    e.preventDefault();
    randomDice();
  } else if (key === "n"){
    e.preventDefault();
    newGame();
  } else if (key === "c"){
    e.preventDefault();
    clearDice();
  } else if (key === "backspace"){
    e.preventDefault();
    popLastDie();
  } else if (key === "escape"){
    closeModal();
    if (editingNameId){ editingNameId = null; render(); }
    if (state.hailMary){ cancelHailMary(); }
  } else if (key === "h"){
    e.preventDefault();
    startHailMary();
  } else if (key === "t"){
    e.preventDefault();
    showThemeModal();
  } else if (key === "m"){
    e.preventDefault();
    const next = !soundOn;
    setSound(next);
    if (next) SFX.toggle();
    showToast(next ? "Sound on" : "Muted", "success");
  }
});

/* =====================================================================
 * INIT
 * ===================================================================== */
document.getElementById("btn-undo").addEventListener("click", undo);
document.getElementById("btn-theme").addEventListener("click", showThemeModal);
document.getElementById("btn-mute").addEventListener("click", () => {
  const next = !soundOn;
  setSound(next);
  if (next) SFX.toggle();
  showToast(next ? "Sound on" : "Muted", "success");
});
document.getElementById("btn-history").addEventListener("click", showHistoryModal);
document.getElementById("btn-export").addEventListener("click", exportFinalCard);
document.getElementById("btn-reset").addEventListener("click", resetScores);
document.getElementById("btn-new").addEventListener("click", newGame);

setSound(soundOn);

// Belt-and-suspenders: persist any in-flight state on tab close.
window.addEventListener("beforeunload", () => {
  try { saveState(); saveSettings(); } catch {}
});
window.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden"){
    try { saveState(); saveSettings(); } catch {}
  }
});

if (!state){
  newGame();
} else {
  render();
  if (state.gameOver) setTimeout(showWinnerModal, 400);
  setTimeout(()=>showToast("Resumed previous game", "success"), 300);
}
</script>
