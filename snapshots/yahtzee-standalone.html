<script>
"use strict";

/* =====================================================================
 * SCORING ENGINE — pure functions
 * ===================================================================== */
const CATEGORIES = [
  {key:"ones",   name:"Ones",            section:"upper", hint:"Sum of 1s"},
  {key:"twos",   name:"Twos",            section:"upper", hint:"Sum of 2s"},
  {key:"threes", name:"Threes",          section:"upper", hint:"Sum of 3s"},
  {key:"fours",  name:"Fours",           section:"upper", hint:"Sum of 4s"},
  {key:"fives",  name:"Fives",           section:"upper", hint:"Sum of 5s"},
  {key:"sixes",  name:"Sixes",           section:"upper", hint:"Sum of 6s"},
  {key:"three",  name:"Three of a Kind", section:"lower", hint:"Sum of all dice"},
  {key:"four",   name:"Four of a Kind",  section:"lower", hint:"Sum of all dice"},
  {key:"full",   name:"Full House",      section:"lower", hint:"25 pts"},
  {key:"small",  name:"Small Straight",  section:"lower", hint:"30 pts"},
  {key:"large",  name:"Large Straight",  section:"lower", hint:"40 pts"},
  {key:"yahtzee",name:"Yahtzee",         section:"lower", hint:"50 pts"},
  {key:"chance", name:"Chance",          section:"lower", hint:"Sum of all dice"},
];
const UPPER_KEYS = ["ones","twos","threes","fours","fives","sixes"];
const LOWER_KEYS = ["three","four","full","small","large","yahtzee","chance"];

function counts(dice){
  const c = [0,0,0,0,0,0,0];
  for (const d of dice) if (d >= 1 && d <= 6) c[d]++;
  return c;
}
const sumDice = dice => dice.reduce((a,b)=>a+(b>=1&&b<=6?b:0),0);
const hasN = (dice,n) => counts(dice).some(x => x >= n);
function isFullHouse(dice){
  const c = counts(dice).filter(x => x>0).sort((a,b)=>a-b);
  return c.length === 2 && c[0] === 2 && c[1] === 3;
}
function hasStraight(dice, len){
  const set = new Set(dice.filter(d => d >= 1 && d <= 6));
  let best = 0, run = 0;
  for (let i = 1; i <= 6; i++){
    if (set.has(i)){ run++; best = Math.max(best,run); } else run = 0;
  }
  return best >= len;
}
const isYahtzee = dice => counts(dice).some(x => x === 5);
const diceComplete = dice => dice.length === 5 && dice.every(d => d >= 1 && d <= 6);

/* Joker rule (Hasbro official):
 *   When a player rolls a Yahtzee and the Yahtzee box has already been
 *   filled in (with 50 OR 0), the player must score the 5 dice using
 *   these rules, IN THIS ORDER:
 *     1) Score the total of all 5 dice in the matching Upper Section box
 *        (the box for the face shown). If that box is still open, you
 *        must use it.
 *     2) If the Upper Section box is already filled, score in any open
 *        Lower Section box. The Lower Section boxes pay full fixed value
 *        when used as a Joker:
 *          3 of a Kind / 4 of a Kind: total of all 5 dice
 *          Full House: 25
 *          Small Straight: 30
 *          Large Straight: 40
 *          Chance: total of all 5 dice
 *     3) If both the Upper matching box AND all Lower boxes are filled,
 *        the player must enter 0 in any open Upper Section box.
 */
function jokerActive(dice, player){
  return !!player && diceComplete(dice) && isYahtzee(dice) && player.scores.yahtzee !== null;
}

/* Categories that the active player is REQUIRED to score in (or restricted
 * to) under the Joker rule, given the current dice. Returns null if no
 * Joker constraint applies.
 *   - {require: <upperKey>}    — must use this upper-section box
 *   - {choose: [<keys>...]}    — Upper box filled, must pick from these
 *                                 (open lower-section boxes, full value)
 *   - {force0: [<upperKeys>]}  — both upper match + all lower are filled,
 *                                 must enter 0 in one of these
 */
function jokerConstraint(dice, player){
  if (!jokerActive(dice, player)) return null;
  const face = dice[0]; // all five are equal
  const upperKey = ["", "ones","twos","threes","fours","fives","sixes"][face];
  if (player.scores[upperKey] === null){
    return {require: upperKey};
  }
  // Upper match is filled — try lower section.
  const lowerOpen = ["three","four","full","small","large","chance"]
    .filter(k => player.scores[k] === null);
  if (lowerOpen.length > 0){
    return {choose: lowerOpen};
  }
  // All lower filled too — must zero an open upper box (the Yahtzee box
  // is by definition already filled; the matching upper is also filled here).
  const upperOpen = ["ones","twos","threes","fours","fives","sixes"]
    .filter(k => player.scores[k] === null);
  return {force0: upperOpen};
}

function scoreFor(key, dice, player = null){
  if (!diceComplete(dice)) return 0;
  const c = counts(dice);
  const joker = jokerActive(dice, player);
  switch(key){
    case "ones":   return c[1] * 1;
    case "twos":   return c[2] * 2;
    case "threes": return c[3] * 3;
    case "fours":  return c[4] * 4;
    case "fives":  return c[5] * 5;
    case "sixes":  return c[6] * 6;
    case "three":  return hasN(dice,3) ? sumDice(dice) : 0;
    case "four":   return hasN(dice,4) ? sumDice(dice) : 0;
    case "full":   return (isFullHouse(dice) || joker) ? 25 : 0;
    case "small":  return (hasStraight(dice,4) || joker) ? 30 : 0;
    case "large":  return (hasStraight(dice,5) || joker) ? 40 : 0;
    case "yahtzee":return isYahtzee(dice) ? 50 : 0;
    case "chance": return sumDice(dice);
  }
  return 0;
}

/* Whether committing this category with current dice will trigger a +100
 * Yahtzee bonus. Bonus only applies if the player previously scored 50 in
 * the Yahtzee box (per official rules — a zeroed Yahtzee forfeits bonuses). */
function bonusOnCommit(catKey, dice, player){
  return diceComplete(dice)
      && isYahtzee(dice)
      && player.scores.yahtzee === 50
      && catKey !== "yahtzee";
}

const upperTotal = (player) => UPPER_KEYS.reduce((a,k)=>a + (player.scores[k] ?? 0), 0);
const upperBonus = (player) => upperTotal(player) >= 63 ? 35 : 0;
const lowerTotal = (player) => LOWER_KEYS.reduce((a,k)=>a + (player.scores[k] ?? 0), 0);
const grandTotal = (player) => upperTotal(player) + upperBonus(player) + lowerTotal(player) + (player.yahtzeeBonus || 0);
const filledCount = (player) => CATEGORIES.filter(c => player.scores[c.key] !== null).length;

/* Heuristic: best unfilled category for current dice for a player.
 * Includes the +100 multi-Yahtzee bonus in the comparison so the suggestion
 * reflects the actual point gain. */
function suggestBest(player, dice){
  if (!diceComplete(dice)) return null;
  const eligible = CATEGORIES.filter(c => player.scores[c.key] === null);
  if (!eligible.length) return null;
  const rarity = {yahtzee:9,large:8,small:7,full:6,four:5,three:4,
                  sixes:3,fives:2,fours:1,threes:0,twos:-1,ones:-2,chance:-3};
  let best = null;
  for (const c of eligible){
    const base = scoreFor(c.key, dice, player);
    const bonus = bonusOnCommit(c.key, dice, player) ? 100 : 0;
    const s = base + bonus;
    const wasted = (base === 0 && bonus === 0);
    const r = rarity[c.key] ?? 0;
    if (!best){ best = {cat:c, score:s, base, bonus, wasted, rare:r}; continue; }
    if (best.wasted && !wasted){ best = {cat:c, score:s, base, bonus, wasted, rare:r}; continue; }
    if (!best.wasted && wasted) continue;
    if (s > best.score || (s === best.score && r > best.rare)){
      best = {cat:c, score:s, base, bonus, wasted, rare:r};
    }
  }
  return best;
}

/* =====================================================================
 * STATE
 * ===================================================================== */
const STORAGE_KEY = "yahtzee.tracker.v1";
const THEME_KEY = "yahtzee.theme.v1";
const SOUND_KEY = "yahtzee.sound.v1";
const HISTORY_KEY = "yahtzee.history.v1";

const THEMES = [
  {id:"midnight",  name:"Midnight",   hint:"Default · sleek dark glass"},
  {id:"retro98",   name:"Retro 98",   hint:"Windows 98 · chunky chrome"},
  {id:"casino",    name:"Casino",     hint:"Green felt · gold & red"},
  {id:"cricket",   name:"Cricket",    hint:"Test cricket · whites + grass"},
  {id:"cyberpunk", name:"Cyberpunk",  hint:"Neon · magenta + cyan"},
  {id:"gameboy",   name:"Gameboy",    hint:"DMG-01 · pea-green LCD"},
  {id:"newsprint", name:"Newsprint",  hint:"Light · ink on paper"},
];

const _validThemes = new Set(THEMES.map(t => t.id));
let currentTheme = localStorage.getItem(THEME_KEY) || "midnight";
if (!_validThemes.has(currentTheme)) currentTheme = "midnight";
let soundOn = (localStorage.getItem(SOUND_KEY) ?? "1") === "1";

function applyTheme(id){
  currentTheme = id;
  if (id === "midnight"){ document.body.removeAttribute("data-theme"); }

/* =====================================================================
 * SOUND — Web Audio synthesis. No external assets.
 * Each scoring category has its own distinct sonic signature.
 * ===================================================================== */
let audioCtx = null;
let masterBus = null; // master gain → destination
let reverbSend = null; // convolver/feedback-delay reverb send

function ac(){
  if (!soundOn) return null;
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
    if (audioCtx) buildAudioGraph();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

// One-time graph: master → destination, plus a feedback-delay reverb send.
function buildAudioGraph(){
  const ctx = audioCtx;
  masterBus = ctx.createGain();
  masterBus.gain.value = 0.9;
  masterBus.connect(ctx.destination);

  // Cheap reverb: stereo-ish feedback delay network
  const delay = ctx.createDelay(2.0);
  delay.delayTime.value = 0.18;
  const fb = ctx.createGain();
  fb.gain.value = 0.42;
  const lp = ctx.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = 4500;
  const wet = ctx.createGain();
  wet.gain.value = 0.20;
  delay.connect(lp); lp.connect(fb); fb.connect(delay);
  lp.connect(wet); wet.connect(masterBus);
  reverbSend = delay;
}

// Theme-aware oscillator settings.
function themeVoice(){
  const t = currentTheme;
  if (t === "retro98")   return {type:"square",   harmonic:[1],     detune:0, filt:{type:"lowpass",freq:2400,q:0.5}, reverb:0,    attack:0.001, decayMul:0.6};
  if (t === "casino")    return {type:"triangle", harmonic:[1,2],   detune:3, filt:{type:"lowpass",freq:5000,q:0.7}, reverb:0.50, attack:0.008, decayMul:1.2};
  if (t === "cricket")   return {type:"triangle", harmonic:[1],     detune:0, filt:{type:"lowpass",freq:3500,q:0.5}, reverb:0.30, attack:0.004, decayMul:0.9};
  if (t === "cyberpunk") return {type:"sawtooth", harmonic:[1,2,4], detune:8, filt:{type:"bandpass",freq:1500,q:1.8}, reverb:0.55, attack:0.003, decayMul:1.1};
  if (t === "gameboy")   return {type:"square",   harmonic:[1],     detune:0, filt:{type:"lowpass",freq:1800,q:0.4}, reverb:0,    attack:0.0,   decayMul:0.55};
  if (t === "newsprint") return {type:"triangle", harmonic:[1],     detune:0, filt:{type:"lowpass",freq:1100,q:0.5}, reverb:0.10, attack:0.008, decayMul:0.85};
  // midnight default
  return {type:"triangle", harmonic:[1,2], detune:4, filt:{type:"lowpass",freq:6000,q:0.7}, reverb:0.30, attack:0.005, decayMul:1.0};
}

// Layered oscillator tone — richer than a bare sine.
function envTone({freq=440, dur=0.18, type=null, vol=0.18, attack=null, decay=0.14, detune=0, when=0, reverbAmt=null}={}){
  const ctx = ac(); if (!ctx) return;
  const v = themeVoice();
  const t0 = ctx.currentTime + when;
  const useType = type || v.type;
  const useAttack = attack ?? v.attack;
  const useDecay = decay * v.decayMul;

  const out = ctx.createGain();
  out.gain.setValueAtTime(0, t0);
  out.gain.linearRampToValueAtTime(vol, t0 + useAttack);
  out.gain.exponentialRampToValueAtTime(0.0001, t0 + useAttack + useDecay);

  // Theme filter
  const filt = ctx.createBiquadFilter();
  filt.type = v.filt.type;
  filt.frequency.value = v.filt.freq;
  filt.Q.value = v.filt.q;
  out.connect(filt);
  filt.connect(masterBus);
  // Reverb send
  const wet = reverbAmt ?? v.reverb;
  if (wet > 0 && reverbSend){
    const sendGain = ctx.createGain();
    sendGain.gain.value = wet;
    filt.connect(sendGain);
    sendGain.connect(reverbSend);
  }

  // Spawn one oscillator per harmonic for richness
  const stop = t0 + useAttack + useDecay + 0.12;
  for (const h of v.harmonic){
    const osc = ctx.createOscillator();
    osc.type = useType;
    osc.frequency.value = freq * h;
    osc.detune.value = (detune + v.detune) * (h === 1 ? 1 : -1);
    const harmGain = ctx.createGain();
    harmGain.gain.value = h === 1 ? 1.0 : (0.4 / h);
    osc.connect(harmGain);
    harmGain.connect(out);
    osc.start(t0);
    osc.stop(stop);
  }
}

function chord(notes, opts={}){
  notes.forEach((f, i) => envTone({...opts, freq:f, when:(opts.when||0)+(opts.stagger||0)*i}));
}

function noiseBurst({dur=0.12, vol=0.06, freq=800, q=1, when=0}={}){
  const ctx = ac(); if (!ctx) return;
  const t0 = ctx.currentTime + when;
  const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate*dur)), ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i=0;i<data.length;i++) data[i] = (Math.random()*2-1)*(1 - i/data.length);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const filt = ctx.createBiquadFilter(); filt.type = "bandpass"; filt.frequency.value = freq; filt.Q.value = q;
  const gain = ctx.createGain(); gain.gain.value = vol;
  src.connect(filt); filt.connect(gain); gain.connect(masterBus);
  src.start(t0);
}

// FM-bell tone: one osc modulating another's frequency. Used for sparkly chimes.
function fmBell({carrier=523.25, mod=659.25, modIndex=200, dur=0.6, vol=0.15, when=0}={}){
  const ctx = ac(); if (!ctx) return;
  const t0 = ctx.currentTime + when;
  const car = ctx.createOscillator(); car.type = "sine"; car.frequency.value = carrier;
  const modOsc = ctx.createOscillator(); modOsc.type = "sine"; modOsc.frequency.value = mod;
  const modGain = ctx.createGain(); modGain.gain.value = modIndex;
  modOsc.connect(modGain); modGain.connect(car.frequency);
  const out = ctx.createGain();
  out.gain.setValueAtTime(0, t0);
  out.gain.linearRampToValueAtTime(vol, t0 + 0.005);
  out.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  car.connect(out);
  out.connect(masterBus);
  if (reverbSend){
    const sg = ctx.createGain(); sg.gain.value = 0.4; out.connect(sg); sg.connect(reverbSend);
  }
  modOsc.start(t0); car.start(t0);
  modOsc.stop(t0 + dur + 0.1); car.stop(t0 + dur + 0.1);
}

// Theme-flavored die-tap sound.
function dieTap(){
  const t = currentTheme;
  if (t === "retro98"){
    envTone({freq:1100, dur:0.04, type:"square", vol:0.08, decay:0.04, reverbAmt:0});
  } else if (t === "casino"){
    envTone({freq:880+Math.random()*100, dur:0.05, type:"sine", vol:0.07, decay:0.05, reverbAmt:0.3});
    noiseBurst({dur:0.04, vol:0.04, freq:1800, q:2});
  } else if (t === "cricket"){
    envTone({freq:200+Math.random()*40, dur:0.05, type:"sine", vol:0.10, decay:0.05, reverbAmt:0.1});
    noiseBurst({dur:0.06, vol:0.05, freq:900, q:2});
  } else if (t === "cyberpunk"){
    fmBell({carrier:1400+Math.random()*200, mod:2800, modIndex:400, dur:0.18, vol:0.08});
    noiseBurst({dur:0.03, vol:0.04, freq:5000, q:6});
  } else if (t === "gameboy"){
    envTone({freq:1500, dur:0.025, type:"square", vol:0.09, decay:0.025, reverbAmt:0});
  } else if (t === "newsprint"){
    noiseBurst({dur:0.04, vol:0.05, freq:2200, q:3});
  } else { // midnight
    envTone({freq:160+Math.random()*60, dur:0.05, type:"square", vol:0.06, decay:0.05, reverbAmt:0.1});
  }
}

// Keypad/number-tap — pitched 1..6 with theme-specific timbre.
function keyTap(value=1){
  const t = currentTheme;
  const pitches = [N("C4"),N("D4"),N("E4"),N("G4"),N("A4"),N("C5")];
  const f = pitches[Math.max(0, Math.min(5, (value|0) - 1))];
  if (t === "retro98"){
    // Classic Win98 chime
    envTone({freq:f, dur:0.06, type:"square", vol:0.10, decay:0.06, reverbAmt:0});
    setTimeout(()=>envTone({freq:f*1.5, dur:0.05, type:"square", vol:0.07, decay:0.05, reverbAmt:0}), 60);
  } else if (t === "casino"){
    // Slot-machine cha-ching
    fmBell({carrier:f*1.5, mod:f*3, modIndex:200, dur:0.28, vol:0.09});
    noiseBurst({dur:0.06, vol:0.04, freq:3200, q:3});
  } else if (t === "cricket"){
    // Leather on willow tap
    envTone({freq:f*0.7, dur:0.08, type:"sine", vol:0.10, decay:0.08, reverbAmt:0.15});
    noiseBurst({dur:0.05, vol:0.05, freq:800, q:2});
  } else if (t === "cyberpunk"){
    // Glitchy laser
    envTone({freq:f*1.5, dur:0.14, type:"sawtooth", vol:0.10, decay:0.14, reverbAmt:0.4, detune:12});
    setTimeout(()=>envTone({freq:f*0.5, dur:0.06, type:"sawtooth", vol:0.06, decay:0.06, reverbAmt:0.3}), 30);
  } else if (t === "gameboy"){
    // 8-bit blip
    envTone({freq:f*2, dur:0.04, type:"square", vol:0.10, decay:0.04, reverbAmt:0});
    setTimeout(()=>envTone({freq:f*4, dur:0.03, type:"square", vol:0.08, decay:0.03, reverbAmt:0}), 40);
  } else if (t === "newsprint"){
    // Typewriter strike
    noiseBurst({dur:0.05, vol:0.05, freq:2400, q:3});
    envTone({freq:f*0.9, dur:0.08, type:"sine", vol:0.06, decay:0.08, reverbAmt:0.05});
  } else { // midnight
    envTone({freq:f*1.5, dur:0.14, type:"triangle", vol:0.10, decay:0.14, reverbAmt:0.20});
  }
}

 * ===================================================================== */
const confettiCanvas = document.getElementById("confetti");
const cctx = confettiCanvas.getContext("2d");
let particles = [];
let confettiAnimId = null;
function resizeConfetti(){
  const dpr = window.devicePixelRatio || 1;
  confettiCanvas.width = window.innerWidth * dpr;
  confettiCanvas.height = window.innerHeight * dpr;
  confettiCanvas.style.width = window.innerWidth + "px";
  confettiCanvas.style.height = window.innerHeight + "px";
  cctx.setTransform(1,0,0,1,0,0);
  cctx.scale(dpr, dpr);
}
window.addEventListener("resize", resizeConfetti);
resizeConfetti();

const CONFETTI_COLORS = ["#8b5cf6","#6366f1","#22d3ee","#fbbf24","#34d399","#f472b6","#fcd34d"];
function burstConfetti(count = 220, originX, originY){
  const w = window.innerWidth, h = window.innerHeight;
  const ox = originX ?? w/2, oy = originY ?? h/2;
  for (let i=0;i<count;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = 6 + Math.random()*9;
    particles.push({
      x:ox, y:oy,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed - 3,
      g:0.22 + Math.random()*0.1,
      drag:0.985,
      rot:Math.random()*Math.PI*2,
      vr:(Math.random()-0.5)*0.4,
      size:6 + Math.random()*8,
      color:CONFETTI_COLORS[(Math.random()*CONFETTI_COLORS.length)|0],
      life:1,
      decay:0.005 + Math.random()*0.006,
      shape:Math.random() < 0.5 ? "rect" : "circle",
    });
  }
  if (!confettiAnimId) tickConfetti();
}
function tickConfetti(){
  cctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  for (const p of particles){
    p.vx *= p.drag; p.vy = p.vy*p.drag + p.g;
    p.x += p.vx; p.y += p.vy;
    p.rot += p.vr; p.life -= p.decay;
    cctx.save();
    cctx.globalAlpha = Math.max(0, p.life);
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot);
    cctx.fillStyle = p.color;
    if (p.shape === "rect") cctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6);
    else { cctx.beginPath(); cctx.arc(0,0,p.size/2,0,Math.PI*2); cctx.fill(); }
    cctx.restore();
  }
  particles = particles.filter(p => p.life > 0 && p.y < window.innerHeight + 60);
  if (particles.length) confettiAnimId = requestAnimationFrame(tickConfetti);
  else { cctx.clearRect(0,0,window.innerWidth,window.innerHeight); confettiAnimId = null; }
}

/* =====================================================================
 * RENDER — players bar
 * ===================================================================== */
const $scGrid = document.getElementById("sc-grid");
const $scMeta = document.getElementById("sc-meta");
const $tray = document.getElementById("tray");
const $roundNum = document.getElementById("round-num");
const $btnUndo = document.getElementById("btn-undo");


function finalizeName(id, name){
  const trimmed = (name || "").trim();
  const p = state.players.find(x => x.id === id);
  if (p){
    p.name = trimmed.slice(0,20) || p.name;
    saveState();
  }
  editingNameId = null;
  render();
}

function toggleColorPicker(id){
  openColorPickerId = openColorPickerId === id ? null : id;
  render();
}

document.addEventListener("click", () => {
  if (openColorPickerId !== null){
    openColorPickerId = null;
    render();
  }
});

/* =====================================================================
 * RENDER — scorecard grid
 * ===================================================================== */
function renderScorecard(){
  $scGrid.innerHTML = "";
  if (!state) return;

  const nPlayers = state.players.length;
  const canAddPlayer = nPlayers < 9 && !state.gameOver && !state.players.some(p => filledCount(p) > 0);
  const trailing = canAddPlayer ? " 32px" : "";
  $scGrid.style.gridTemplateColumns = `200px repeat(${nPlayers}, minmax(60px, 1fr))${trailing}`;

  const dice = state.dice;
  const player = state.players[state.currentIdx];
  const suggestion = (!state.gameOver && diceComplete(dice)) ? suggestBest(player, dice) : null;

  // Header row
  const headEmpty = document.createElement("div");
  headEmpty.className = "sc-cell player-head label-head";
  headEmpty.innerHTML = `<div class="head-name" style="font-size:10px;color:var(--text-3);letter-spacing:0.08em;text-transform:uppercase;font-weight:600">Category</div>`;
  $scGrid.appendChild(headEmpty);

  state.players.forEach((p, i) => {
    const head = document.createElement("div");
    head.className = "sc-cell player-head";
    head.dataset.col = String(i);
    if (i === state.currentIdx && !state.gameOver) head.classList.add("active");
    head.style.setProperty("--pc", p.color);
    head.style.setProperty("--pc-glow", p.glow);

    const top = document.createElement("div");
    top.className = "head-top";

    if (editingNameId === p.id){
      const input = document.createElement("input");
      input.className = "head-name-input";
      input.value = p.name;
      input.maxLength = 20;
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") finalizeName(p.id, input.value);
        else if (e.key === "Escape") { editingNameId = null; render(); }
      });
      input.addEventListener("blur", () => finalizeName(p.id, input.value));
      top.appendChild(input);
      setTimeout(()=>{input.focus();input.select();},0);
    } else {
      const name = document.createElement("button");
      name.className = "head-name";
      name.textContent = p.name;
      name.title = "Click to rename · double-click to change color";
      name.addEventListener("click", (e) => { e.stopPropagation(); editingNameId = p.id; render(); });
      name.addEventListener("dblclick", (e) => { e.stopPropagation(); toggleColorPicker(p.id); });
      top.appendChild(name);
    }

    head.appendChild(top);

    if (openColorPickerId === p.id){
      const pop = document.createElement("div");
      pop.className = "color-popover";
      pop.addEventListener("click", e => e.stopPropagation());
      PLAYER_COLORS.forEach(c => {
        const sw = document.createElement("button");
        sw.className = "color-swatch" + (c.base === p.color ? " selected" : "");
        sw.style.background = c.base;
        sw.style.color = c.base;
        sw.title = c.name;
        sw.addEventListener("click", () => {
          pushHistory();
          p.color = c.base; p.glow = c.glow;
          openColorPickerId = null;
          saveState(); render();
        });
        pop.appendChild(sw);
      });
      head.appendChild(pop);
    }

    $scGrid.appendChild(head);
  });

  if (canAddPlayer){
    const addCell = document.createElement("div");
    addCell.className = "sc-cell player-head add-head";
    const btn = document.createElement("button");
    btn.className = "head-add";
    btn.title = "Add player";
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
    btn.addEventListener("click", addPlayer);
    addCell.appendChild(btn);
    $scGrid.appendChild(addCell);
  }

  // Upper section
  for (const cat of CATEGORIES.filter(c => c.section === "upper")){
    appendCategoryRow(cat, suggestion);
  }
  appendSubtotalRow("Upper Subtotal", "", p => upperTotal(p), false);
  appendBonusRow();

  // Lower section
  appendSectionDivider("Lower Section");
  for (const cat of CATEGORIES.filter(c => c.section === "lower")){
    appendCategoryRow(cat, suggestion);
  }

  if (state.players.some(p => p.scores.yahtzee !== null || (p.yahtzeeBonus || 0) > 0)){
    appendYahtzeeBonusRow();
  }

  appendSubtotalRow("Lower Subtotal", "", p => lowerTotal(p), false);
  appendSubtotalRow("Grand Total", "", p => grandTotal(p), true);

  const totalCells = nPlayers * 13;
  const filledCells = state.players.reduce((a,p)=>a+filledCount(p), 0);
  $scMeta.textContent = `${filledCells}/${totalCells} filled`;

}

function appendSectionDivider(label){
  const div = document.createElement("div");
  div.className = "sc-section-row";
  div.textContent = label;
  $scGrid.appendChild(div);
}

function appendTrailingCell(extraClass=""){
  const canAddPlayer = state.players.length < 9 && !state.gameOver && !state.players.some(p => filledCount(p) > 0);
  if (!canAddPlayer) return;
  const cell = document.createElement("div");
  cell.className = "sc-cell trailing " + extraClass;
  $scGrid.appendChild(cell);
}

function appendCategoryRow(cat, suggestion){
  const dice = state.dice;
  const hm = state.hailMary;
  const labelCell = document.createElement("div");
  labelCell.className = "sc-cell cat-label";
  labelCell.dataset.hint = cat.hint;
  labelCell.innerHTML = `<span class="cat-name">${cat.name}</span>`;
  $scGrid.appendChild(labelCell);

  state.players.forEach((p, i) => {
    const cell = document.createElement("div");
    cell.className = "sc-cell score";
    cell.style.setProperty("--pc", p.color);
    cell.style.setProperty("--pc-glow", p.glow);
    cell.dataset.cat = cat.key;
    cell.dataset.player = p.id;
    cell.dataset.col = String(i);

    const isActive = i === state.currentIdx && !state.gameOver;
    if (isActive) cell.classList.add("active-col");

    const locked = p.scores[cat.key] !== null;
    const hmActiveForThisPlayer = hm && hm.playerId === p.id;
    const constraint = isActive && !hm ? jokerConstraint(dice, p) : null;
    const allowedByJoker = (() => {
      if (!constraint) return true;
      if (constraint.require) return cat.key === constraint.require;
      if (constraint.choose) return constraint.choose.includes(cat.key);
      if (constraint.force0) return constraint.force0.includes(cat.key);
      return true;
    })();

    if (hmActiveForThisPlayer && !hm.source && p.scores[cat.key] === 0){
      cell.classList.add("locked","hm-source");
      cell.innerHTML = `<span>0</span>`;
      cell.addEventListener("click", () => selectHailMarySource(cat.key));
    } else if (hmActiveForThisPlayer && hm.source && p.scores[cat.key] === null && cat.key !== hm.source){
      cell.classList.add("empty","hm-target");
      cell.innerHTML = `<span>·</span>`;
      cell.addEventListener("click", () => selectHailMaryTarget(cat.key));
    } else if (hmActiveForThisPlayer && hm.source === cat.key){
      cell.classList.add("locked","hm-selected");
      cell.innerHTML = `<span>0</span>`;
    } else if (locked){
      cell.classList.add("locked");
      cell.innerHTML = `<span>${p.scores[cat.key]}</span>`;
    } else if (isActive && diceComplete(dice) && !hm && allowedByJoker){
      const val = scoreFor(cat.key, dice, p);
      const willBonus = bonusOnCommit(cat.key, dice, p);
      cell.classList.add("preview");
      if (val === 0 && !willBonus) cell.classList.add("zero");
      if (suggestion && suggestion.cat.key === cat.key && !suggestion.wasted) cell.classList.add("suggested");
      if (constraint && (constraint.require || constraint.choose)) cell.classList.add("joker-allowed");
      if (constraint && constraint.force0) cell.classList.add("joker-force0");
      cell.innerHTML = willBonus
        ? `<span class="val">${val}<sup style="font-size:9px;opacity:0.85;margin-left:2px;color:var(--gold)">+100</sup></span>`
        : `<span class="val">${val}</span>`;
      cell.addEventListener("click", () => commitScore(cat.key));
    } else if (isActive && diceComplete(dice) && !hm && !allowedByJoker){
      // Joker rule blocks this cell — show but disabled
      cell.classList.add("empty","joker-blocked");
      cell.innerHTML = `<span>·</span>`;
    } else {
      cell.classList.add("empty");
      cell.innerHTML = `<span>·</span>`;
    }
    $scGrid.appendChild(cell);
  });
  appendTrailingCell();
}

function appendSubtotalRow(label, hint, fn, grand){
  const labelCell = document.createElement("div");
  labelCell.className = "sc-cell cat-label subtotal" + (grand ? " grand" : "");
  if (hint) labelCell.dataset.hint = hint;
  labelCell.innerHTML = `<span class="cat-name">${label}</span>`;
  $scGrid.appendChild(labelCell);

  let ranks = null, lastIdx = -1;
  if (grand){
    const totals = state.players.map(fn);
    const sorted = totals.map((t,i) => ({i, total:t})).sort((a,b) => b.total - a.total);
    ranks = new Array(state.players.length).fill(null);
    let curRank = 0, lastTotal = null;
    sorted.forEach((s, idx) => {
      if (lastTotal === null || s.total !== lastTotal){ curRank = idx; lastTotal = s.total; }
      ranks[s.i] = curRank;
    });
    const minT = Math.min(...totals);
    const maxT = Math.max(...totals);
    const someoneHasScore = state.players.some(x => filledCount(x) > 0);
    if (someoneHasScore && minT !== maxT){
      if (totals.filter(t => t === minT).length === 1) lastIdx = totals.indexOf(minT);
    }
  }

  state.players.forEach((p, i) => {
    const cell = document.createElement("div");
    cell.className = "sc-cell score subtotal locked" + (grand ? " grand" : "");
    cell.dataset.col = String(i);
    cell.style.setProperty("--pc", p.color);
    cell.style.setProperty("--pc-glow", p.glow);
    if (i === state.currentIdx && !state.gameOver) cell.classList.add("active-col");
    if (grand){
      const r = ranks[i];
      const total = fn(p);
      const someoneHasScore = state.players.some(x => filledCount(x) > 0);
      const isLast = i === lastIdx;
      if (r === 0 && someoneHasScore) cell.classList.add("rank-gold");
      else if (r === 1 && someoneHasScore) cell.classList.add("rank-silver");
      else if (r === 2 && someoneHasScore) cell.classList.add("rank-bronze");
      if (isLast) cell.classList.add("rank-last");
      cell.innerHTML = isLast
        ? `<span class="grand-val"><span class="last-mark" title="last place">😭</span><span class="num">${total}</span></span>`
        : `<span class="grand-val"><span class="medal"></span><span class="num">${total}</span></span>`;
    } else {
      cell.innerHTML = `<span>${fn(p)}</span>`;
    }
    $scGrid.appendChild(cell);
  });
  appendTrailingCell(grand ? "grand" : "subtotal");
}

function appendYahtzeeBonusRow(){
  const labelCell = document.createElement("div");
  labelCell.className = "sc-cell cat-label";
  labelCell.dataset.hint = "+100 each extra Yahtzee";
  labelCell.innerHTML = `<span class="cat-name" style="color:var(--gold-2)">Yahtzee Bonus</span>`;
  $scGrid.appendChild(labelCell);

  state.players.forEach((p, i) => {
    const cell = document.createElement("div");

    cell.style.setProperty("--pc-glow", p.glow);

    } else {
      cell.classList.add("empty");
      cell.innerHTML = `<span>·</span>`;
    }
    $scGrid.appendChild(cell);
  });
  appendTrailingCell();
}

function appendBonusRow(){
  const labelCell = document.createElement("div");
  labelCell.className = "sc-cell cat-label";
  labelCell.dataset.hint = "Score 63+ in upper section to earn +35";
  labelCell.innerHTML = `<span class="cat-name" style="color:var(--text-3);font-size:11px;letter-spacing:0.04em;text-transform:uppercase;font-weight:600">Upper Bonus</span>`;
  $scGrid.appendChild(labelCell);

  state.players.forEach((p, i) => {
    const cell = document.createElement("div");
    cell.className = "sc-cell score bonus-progress";
    cell.dataset.col = String(i);
    cell.style.setProperty("--pc", p.color);
    cell.style.setProperty("--pc-glow", p.glow);
    if (i === state.currentIdx && !state.gameOver) cell.classList.add("active-col");
    const ut = upperTotal(p);
    const earned = ut >= 63;
    const pct = Math.min(100, (ut/63)*100);
    cell.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;width:100%">
        <span style="${earned?'color:var(--gold);font-weight:700':''};font-size:11px">${earned ? "+35" : `${ut}/63`}</span>
        <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
      </div>`;
    $scGrid.appendChild(cell);
  });
  appendTrailingCell();
}

/* =====================================================================
 * RENDER — dice tray
 * ===================================================================== */
function renderTray(){
  if (!state) { $tray.innerHTML = ""; return; }

  if (state.gameOver){
    renderGameOverTray();
    return;
  }

  const player = state.players[state.currentIdx];
  $tray.style.setProperty("--pc", player.color);
  $tray.style.setProperty("--pc-glow", player.glow);

  const complete = diceComplete(state.dice);
  const suggestion = complete ? suggestBest(player, state.dice) : null;
  const joker = jokerActive(state.dice, player);
  const willBonus = complete && isYahtzee(state.dice) && player.scores.yahtzee === 50;

  $tray.innerHTML = "";

  // ─── Slim header: who's up + filled count ─────────────────────────
  const header = document.createElement("div");
  header.className = "tray-header";
  header.innerHTML = `
    <div class="tray-player-info">
      <span class="tray-rail"></span>
      <span class="tray-player-name">${escapeHtml(player.name)}</span>
      <span class="tray-round">R${currentRound()} · ${filledCount(player)}/13</span>
    </div>`;
  $tray.appendChild(header);

  // ─── Slim horizontal input strip: dice + inline keypad ────────────
  const strip = document.createElement("div");
  strip.className = "input-strip";

  // Dice display: 5 small slots showing what's been entered
  const slots = document.createElement("div");
  slots.className = "dice-strip";
  for (let i=0;i<5;i++){
    const die = document.createElement("button");
    const v = state.dice[i];
    die.className = "dice-slot" + (v === 0 ? " empty" : "");
    if (v >= 1 && v <= 6) die.dataset.face = String(v);
    die.dataset.idx = i;
    die.setAttribute("aria-label", v === 0 ? `Die ${i+1}: empty` : `Die ${i+1}: ${v}. Click to clear.`);
    if (v === 0){
      die.innerHTML = `<span class="dice-slot-empty">·</span>`;
    } else {
      const face = document.createElement("div");
      face.className = "die-face";
      for (let p=0;p<9;p++){
        const pip = document.createElement("span");
        pip.className = "pip";
        face.appendChild(pip);
      }
      die.appendChild(face);
    }
    die.addEventListener("click", () => clearDie(i));
    slots.appendChild(die);
  }
  strip.appendChild(slots);

  // Inline keypad row: 1–6 + backspace + random
  const pad = document.createElement("div");
  pad.className = "keypad-strip";
  for (let v=1; v<=6; v++){
    const b = document.createElement("button");
    b.className = "kp-key";
    b.textContent = v;
    b.title = `Add ${v}`;
    b.addEventListener("click", () => addDieValue(v));
    pad.appendChild(b);
  }
  // Backspace — pop the most recent typed die
  const bs = document.createElement("button");
  bs.className = "kp-key kp-icon";
  bs.title = "Backspace · pop last die";
  bs.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H8L3 12l5 7h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>`;
  bs.addEventListener("click", popLastDie);
  pad.appendChild(bs);
  // Random shuffle
  const rnd = document.createElement("button");
  rnd.className = "kp-key kp-icon";
  rnd.title = "Random fill · R";
  rnd.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="16" cy="16" r="1.4" fill="currentColor"/><circle cx="16" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="16" r="1.4" fill="currentColor"/></svg>`;
  rnd.addEventListener("click", randomDice);
  pad.appendChild(rnd);
  strip.appendChild(pad);

  $tray.appendChild(strip);

  // Hail Mary control
  const hmZeroes = CATEGORIES.filter(c => player.scores[c.key] === 0).length;
  const hmEmpties = CATEGORIES.filter(c => player.scores[c.key] === null).length;
  const hmCanUse = !player.hailMaryUsed && hmZeroes > 0 && hmEmpties > 0;
  const hmActive = state.hailMary && state.hailMary.playerId === player.id;

  const hmRow = document.createElement("button");
  hmRow.className = "hm-btn" + (hmActive ? " active" : "") + (player.hailMaryUsed ? " used" : "");
  hmRow.disabled = !hmCanUse && !hmActive;
  if (hmActive){
    hmRow.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      <span>Cancel Hail Mary</span>
      <span class="hm-status">${state.hailMary.source ? "pick target" : "pick source"}</span>`;
    hmRow.addEventListener("click", cancelHailMary);
  } else {
    hmRow.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L4 7v6c0 5 3.5 8.5 8 9 4.5-.5 8-4 8-9V7l-8-5z"/></svg>
      <span>Hail Mary</span>
      <span class="hm-status">${player.hailMaryUsed ? "used" : hmCanUse ? "swap a 0" : "no zeros yet"}</span>`;
    hmRow.addEventListener("click", startHailMary);
  }
  $tray.appendChild(hmRow);

  // Collapsible Stats — closed by default, toggled via header button
  const statsPanel = document.createElement("div");
  statsPanel.className = "stats-panel" + (statsPanelOpen ? " open" : "");

  const toggle = document.createElement("button");
  toggle.className = "stats-toggle";
  toggle.innerHTML = `
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-7"/></svg>
    <span>Stats for Geeks</span>
    <svg class="chev" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  `;
  toggle.addEventListener("click", () => {
    statsPanelOpen = !statsPanelOpen;
    saveSettings();
    render();
  });
  statsPanel.appendChild(toggle);

  if (statsPanelOpen){
    const body = document.createElement("div");
    body.className = "stats-body";

    const ctrl = document.createElement("div");
    ctrl.className = "stats-rolls-row";
    ctrl.innerHTML = `
      <span class="stats-rolls-label">Rolls left</span>
      <div class="stats-rolls-seg">
        ${[2,1,0].map(r => `<button data-r="${r}" class="${statsRollsLeft===r?"active":""}">${r}</button>`).join("")}
      </div>`;
    body.appendChild(ctrl);
    ctrl.querySelectorAll("button[data-r]").forEach(b => b.addEventListener("click", () => {
      statsRollsLeft = parseInt(b.dataset.r, 10);
      saveSettings();
      render();
    }));

    const grid = document.createElement("div");
    grid.className = "stats-rows";
    body.appendChild(grid);

    grid.innerHTML = `<div class="stats-loading">Calculating…</div>`;
    const playerSnap = player;
    const diceSnap = state.dice.slice();
    const rollsSnap = statsRollsLeft;
    const reqId = ++statsRenderToken;
    setTimeout(() => {
      if (reqId !== statsRenderToken) return;
      const results = computeStats(playerSnap, diceSnap, rollsSnap);
      results.sort((a,b) => b.ev - a.ev);
      const hero = statsBestMoveHtml(results);
      grid.innerHTML = hero + results.map(r => statsRowHtml(r)).join("");
    }, 20);

    statsPanel.appendChild(body);
  }
  $tray.appendChild(statsPanel);

  // Multi-Yahtzee / Joker indicator — show before the suggestion banner
  if (joker){
    const constraint = jokerConstraint(state.dice, player);
    let constraintMsg = "Joker rule active";
    if (constraint?.require){
      const upperName = CATEGORIES.find(c => c.key === constraint.require).name;
      constraintMsg = `Must use ${upperName} (Joker)`;
    } else if (constraint?.choose){
      constraintMsg = "Pick any open lower box (Joker)";
    } else if (constraint?.force0){
      constraintMsg = "Must zero an upper box (Joker)";
    }
    const jb = document.createElement("div");
    jb.className = "tray-suggestion";
    jb.style.background = "linear-gradient(135deg,rgba(251,191,36,0.15),rgba(139,92,246,0.12))";
    jb.style.borderColor = "rgba(251,191,36,0.45)";
    jb.innerHTML = willBonus
      ? `<span class="label" style="color:var(--gold)">Yahtzee!</span><span class="name">${constraintMsg}</span><span class="pts" style="color:var(--gold)">+100</span>`
      : `<span class="label" style="color:var(--gold)">Yahtzee!</span><span class="name">${constraintMsg}</span>`;
    $tray.appendChild(jb);
  }

  // Suggestion or hint text
  if (suggestion && !suggestion.wasted){
    const sug = document.createElement("div");
    sug.className = "tray-suggestion";
    sug.innerHTML = `
      <span class="label">Best</span>
      <span class="name">${suggestion.cat.name}</span>

}

/* =====================================================================
 * RENDER — composite
 * ===================================================================== */
function render(){
  $roundNum.textContent = String(currentRound());
  renderScorecard();
  renderTray();
  $btnUndo.disabled = !state || state.history.length === 0;

  // Animate score number flips for player cards if total changed
  document.querySelectorAll(".pc-total .flip-num").forEach(el => {
    if (el.dataset.lastVal && el.dataset.lastVal !== el.textContent){
      el.classList.remove("flip"); void el.offsetWidth; el.classList.add("flip");
    }
    el.dataset.lastVal = el.textContent;
  });
}

function currentRound(){
  if (!state) return 1;
  // Round = min number of categories filled by any active player + 1, capped at 13
  const minFilled = Math.min(...state.players.map(filledCount));
  return Math.min(13, minFilled + 1);
}

/* =====================================================================
 * INTERACTIONS — dice
 * ===================================================================== */
function cycleDie(idx){
  if (state.gameOver || state.hailMary) return;
  // Tap a filled die to clear; tap an empty die to set to 1. Use the keypad for 2–6.
  state.dice[idx] = state.dice[idx] !== 0 ? 0 : 1;
  SFX.die();
  saveState();
  render();
  flashDie(idx);
}
function clearDie(idx){
  if (state.gameOver || state.hailMary) return;
  if (state.dice[idx] === 0) return;
  state.dice[idx] = 0;
  saveState();
  render();
  flashDie(idx);
}
function addDieValue(v){
  if (state.gameOver || state.hailMary) return;
  // Find first empty slot, else replace the last
  let idx = state.dice.findIndex(d => d === 0);
  if (idx === -1) idx = 4;
  state.dice[idx] = v;
  SFX.add(v);
  saveState();
  render();
  flashDie(idx);
}
function clearDice(){
  if (state.gameOver || state.hailMary) return;
  state.dice = [0,0,0,0,0];
  saveState();
  render();
}

// Pop the most-recently-typed die (rightmost non-zero slot).
function popLastDie(){
  if (state.gameOver || state.hailMary) return;
  for (let i=4;i>=0;i--){
    if (state.dice[i] !== 0){
      state.dice[i] = 0;
      SFX.die();
      saveState();
      render();
      return;
    }
  }
}
function randomDice(){
  if (state.gameOver || state.hailMary) return;
  state.dice = [0,0,0,0,0];
  render();
  // Animate roll one at a time
  const els = $tray.querySelectorAll(".die");
  let step = 0;
  const interval = setInterval(() => {
    if (step >= 5){
      clearInterval(interval);
      saveState();
      render();
      return;
    }
    state.dice[step] = 1 + Math.floor(Math.random()*6);
    render();
    flashDie(step);
    step++;
  }, 90);
}
function flashDie(idx){
  // Re-query because render replaced DOM
  requestAnimationFrame(() => {
    const die = $tray.querySelector(`.die[data-idx="${idx}"]`);
    if (die){
      die.classList.remove("flip"); void die.offsetWidth; die.classList.add("flip");
    }
  });
}

/* =====================================================================
 * INTERACTIONS — score commit
 * ===================================================================== */
function commitScore(catKey){
  if (state.gameOver) return;
  const player = state.players[state.currentIdx];
  if (player.scores[catKey] !== null) return;
  if (!diceComplete(state.dice)) return;

  // Joker-rule precedence: if the matching upper-section box is open and
  // the dice are a Yahtzee with a filled Yahtzee box, the player MUST use it.
  const constraint = jokerConstraint(state.dice, player);
  if (constraint){
    if (constraint.require && catKey !== constraint.require){
      const target = CATEGORIES.find(c => c.key === constraint.require);
      showToast(`Joker rule: must score ${target.name} first`, "warn");
      SFX.invalid();
      return;
    }
    if (constraint.choose && !constraint.choose.includes(catKey)){
      showToast(`Joker rule: pick a lower-section box`, "warn");
      SFX.invalid();
      return;
    }
    if (constraint.force0 && !constraint.force0.includes(catKey)){
      showToast(`Joker rule: must zero an upper-section box`, "warn");
      SFX.invalid();
      return;
    }
  }

  pushHistory();

  const value = scoreFor(catKey, state.dice, player);
  const bonusAwarded = bonusOnCommit(catKey, state.dice, player);
  if (bonusAwarded){
    player.yahtzeeBonus = (player.yahtzeeBonus || 0) + 100;
  }

  player.scores[catKey] = value;

  // Flash cell
  flashCell(catKey, player.id, catKey === "yahtzee" && value === 50);

  // Sound-like feedback via toast + per-category SFX
  const catNm = CATEGORIES.find(c => c.key === catKey).name;
  if (value > 0){
    showToast(`+${value} · ${catNm}`, "success");
    if (SFX[catKey]) SFX[catKey]();
  } else {
    showToast(`Zeroed ${catNm}`, "warn");
    SFX.zero();
  }

  // Yahtzee celebration
  if (catKey === "yahtzee" && value === 50){
    setTimeout(() => celebrateYahtzee(true), 50);
  } else if (bonusAwarded){
    const n = Math.floor(player.yahtzeeBonus / 100) + 1; // ordinal incl. the original
    const ord = ["","2nd","3rd","4th","5th","6th","7th","8th","9th"][n] || `${n}th`;
    setTimeout(() => { showToast(`+100 · ${ord} Yahtzee!`, "gold"); celebrateYahtzee(true); SFX.bonus(); }, 200);
  }

  // Reset dice & advance turn
  state.dice = [0,0,0,0,0];
  advanceTurn();

  // End-game check
  if (state.players.every(p => filledCount(p) === 13)){
    state.gameOver = true;
    recordGameToHistory();
    saveState();
    render();
    setTimeout(() => { showWinnerModal(); burstConfetti(360); SFX.win(); }, 700);
    return;
  }

  saveState();
  render();
}

function flashCell(catKey, playerId, yahtzee){
  requestAnimationFrame(() => {
    const cell = $scGrid.querySelector(`.sc-cell.score[data-cat="${catKey}"][data-player="${playerId}"]`);
    if (!cell) return;
    cell.classList.add(yahtzee ? "yahtzee-flash" : "commit-flash");
    setTimeout(() => cell.classList.remove("commit-flash","yahtzee-flash"), 1200);
  });
}

function celebrateYahtzee(big){
  const rect = $tray.getBoundingClientRect();
  burstConfetti(big ? 240 : 120, rect.left + rect.width/2, rect.top + 60);
  showToast("YAHTZEE!", "gold");
}

function advanceTurn(){
  state.currentIdx = (state.currentIdx + 1) % state.players.length;
}

/* =====================================================================
 * HAIL MARY — house rule
 * Once per game, a player can move a 0 from one zeroed category into
 * another empty category (rescoring with the dice that were used for the
 * original zero is impossible since we don't store them, so the rescue
 * just shifts the 0 to a category of their choice — clearing the original
 * back to empty for a future entry). Practical effect: trade away a
 * ruinous category lock-in for a less painful one.
 * ===================================================================== */
function startHailMary(){
  if (!state || state.gameOver) return;
  const player = state.players[state.currentIdx];
  if (player.hailMaryUsed){ showToast("Hail Mary already used", "warn"); return; }

  const zeroes = CATEGORIES.filter(c => player.scores[c.key] === 0);
  const empties = CATEGORIES.filter(c => player.scores[c.key] === null);
  if (zeroes.length === 0){ showToast("No zeroed categories to swap", "warn"); return; }
  if (empties.length === 0){ showToast("No empty categories to swap into", "warn"); return; }

  state.hailMary = { playerId: player.id, source: null };
  showToast("Hail Mary: pick a 0 to move", "");
  render();
}

function cancelHailMary(){
  state.hailMary = null;
  render();
}

function selectHailMarySource(catKey){
  const player = state.players[state.currentIdx];
  if (player.scores[catKey] !== 0) return;
  state.hailMary.source = catKey;
  showToast(`Now pick where to move the 0`, "");
  render();
}

function selectHailMaryTarget(catKey){
  const player = state.players[state.currentIdx];
  const src = state.hailMary.source;
  if (!src || player.scores[catKey] !== null) return;
  if (catKey === src) return;
  pushHistory();
  // Move the 0: target receives 0, source becomes empty (re-rollable).
  player.scores[src] = null;
  player.scores[catKey] = 0;
  player.hailMaryUsed = true;
  state.hailMary = null;
  SFX.hailMary();
  showToast(`Hail Mary: ${catName(src)} → ${catName(catKey)}`, "success");
  // Flash both affected cells
  flashCell(catKey, player.id, false);
  saveState();
  render();
}

const catName = (k) => CATEGORIES.find(c => c.key === k)?.name || k;

/* =====================================================================
 * HISTORY / UNDO
 * ===================================================================== */
function pushHistory(){
  // Snapshot only what changes between actions
  const snap = {
    players: state.players.map(p => ({
      ...p,
      scores: {...p.scores},
    })),
    currentIdx: state.currentIdx,
    dice: [...state.dice],
    gameOver: state.gameOver,
    hailMary: state.hailMary ? {...state.hailMary} : null,
  };
  state.history.push(snap);
  // Cap history
  if (state.history.length > 50) state.history.shift();
}

function undo(){
  if (!state || state.history.length === 0){
    showToast("Nothing to undo", "warn");
    return;
  }
  const prev = state.history.pop();
  state.players = prev.players;
  state.currentIdx = prev.currentIdx;
  state.dice = prev.dice;
  state.gameOver = prev.gameOver;
  state.hailMary = prev.hailMary || null;
  closeModal();
  showToast("Undone", "success");
  saveState();
  render();
}

/* =====================================================================
 * GAME LIFECYCLE
 * ===================================================================== */
function resetScores(){
  if (!state) return;
  showConfirm({
    title:"Reset all scores?",
    body:"Players and colors stay; all category scores will be cleared.",
    confirmText:"Reset",
    onConfirm:() => {
      state.players.forEach(p => {
        p.scores = Object.fromEntries(CATEGORIES.map(c => [c.key, null]));
        p.yahtzeeBonus = 0;
        p.hailMaryUsed = false;
      });
      state.currentIdx = 0;
      state.dice = [0,0,0,0,0];
      state.history = [];
      state.gameOver = false;
      state.startedAt = Date.now();
      state.hailMary = null;
      saveState();
      showToast("Scores reset", "success");
      render();
    }
  });
}

function newGame(){
  showSetupModal({
    title: state ? "New game" : "Welcome to Yahtzee Tracker",
    initialPlayers: state ? state.players.map(p => ({name:p.name, color:p.color, glow:p.glow}))
                          : [{...PLAYER_COLORS[0], name:"Player 1"},{...PLAYER_COLORS[1], name:"Player 2"}].map((c,i) => ({name:c.name, color:c.base, glow:c.glow})),
    onConfirm: (defs) => {
      state = {
        players: defs.map(d => {
          const p = makePlayer(d.name, 0);
          p.color = d.color; p.glow = d.glow;
          return p;
        }),
        currentIdx: 0,
        dice: [0,0,0,0,0],
        history: [],
        gameOver: false,
        startedAt: Date.now(),
        hailMary: null,
      };
      closeModal();
      saveState();
      showToast("New game started", "success");
      render();
    }
  });
}

function removePlayer(id){
  if (!state) return;
  if (state.players.length <= 2){ showToast("Need at least 2 players", "warn"); return; }
  const idx = state.players.findIndex(p => p.id === id);
  if (idx < 0) return;
  if (filledCount(state.players[idx]) > 0){ showToast("Can't remove a player with scores", "warn"); return; }
  pushHistory();
  state.players.splice(idx, 1);
  if (state.currentIdx >= state.players.length) state.currentIdx = 0;
  saveState();
  render();
}

function addPlayer(){
  if (!state || state.players.length >= 9) return;
  if (state.players.some(p => filledCount(p) > 0)){
    showToast("Can't add players after the game starts", "warn");
    return;
  }
  pushHistory();
  const usedColors = new Set(state.players.map(p => p.color));
  const nextColor = PLAYER_COLORS.find(c => !usedColors.has(c.base)) || PLAYER_COLORS[state.players.length % PLAYER_COLORS.length];
  const newP = makePlayer(`Player ${state.players.length + 1}`, 0);
  newP.color = nextColor.base; newP.glow = nextColor.glow;
  state.players.push(newP);
  editingNameId = newP.id;
  saveState();
  render();
}

/* =====================================================================
 * STATS FOR GEEKS — closed-form EV where tractable, MC otherwise.
 *
 * Locked dice: any non-zero entry the user has typed is HELD and never
 * rerolled by the simulation. Only zero positions get rolled, and only
 * those can be rerolled across the remaining rolls.
 * ===================================================================== */
const STATS_TRIALS = 4000;
let statsRenderToken = 0;

/* Closed-form helpers ------------------------------------------------- */

// E[1 unrolled die, k rolls, target = match a specific face N (used for upper).
// Strategy: keep N if rolled, else reroll. Across k rolls, P(match) = 1 - (5/6)^k.
// EV per die contributing to "Ns" = N * P, plus the expected non-N value isn't
// counted in the upper category.
function pMatchInRolls(k){ return 1 - Math.pow(5/6, k); }

/* P(Yahtzee) given current dice state and rerolls remaining.
 * Strategy: pick most common typed face (ties: highest), reroll all dice
 * not matching it. Empty slots are rolled once, then can be rerolled. */
function pYahtzeeFromState(dice, rollsLeft){
  const typed = dice.filter(d => d > 0);
  const empty = 5 - typed.length;
  if (typed.length === 0) return pYahtzeeFromScratch(rollsLeft + 1);
  const c = [0,0,0,0,0,0,0];
  for (const d of typed) c[d]++;
  let bestCount = 0;
  for (let f=6; f>=1; f--) if (c[f] > bestCount) bestCount = c[f];
  const pTyped = pMatchInRolls(rollsLeft);
  const pEmpty = pMatchInRolls(rollsLeft + 1);
  const typedNonMatch = typed.length - bestCount;
  return Math.pow(pTyped, typedNonMatch) * Math.pow(pEmpty, empty);
}

// Exact-ish probability of getting 5-of-a-kind in N total rolls (N=1,2,3) when
// starting from M dice. Uses the optimal "keep the most common face" policy.
function pYahtzeeFromScratch(N, dice = 5){
  // Let p[i] = probability of having i matching dice after the current roll.
  // After roll 1, distribution of max-count over 5 dice is known:
  //   1: 0.0926; 2: 0.4630; 3: 0.3858; 4: 0.0579; 5: 0.0008 (approx)
  // We'll compute exactly via enumeration for fresh start.
  // For simplicity, compute directly via simulation-free exact recursion.
  if (dice !== 5){
    // Fall back to simulation for unusual cases (shouldn't trigger normally).
    let hits = 0;
    for (let t=0; t<10000; t++){
      const d = [];
      for (let i=0;i<dice;i++) d.push(1+Math.floor(Math.random()*6));
      // Pick most common, reroll rest
      let bestF = 1, bestC = 0;
      const cs = [0,0,0,0,0,0,0];
      for (const x of d) cs[x]++;
      for (let f=1;f<=6;f++) if (cs[f]>bestC){ bestC=cs[f]; bestF=f; }
      let kept = bestC;
      for (let r=1;r<N;r++){
        for (let i=kept;i<dice;i++) if (Math.random()*6 < 1) kept++;
      }
      if (kept === dice) hits++;
    }
    return hits/10000;
  }
  // For N=1: P(immediate Yahtzee) = 6 / 6^5 = 6/7776 ≈ 0.000772
  // For N≥2: dynamic-program over count of matches after each roll.
  // After picking face F: i=count of F in current roll; reroll 5-i, each has 1/6 chance of becoming F.
  // dist[i] after a roll = binomial(5-i_prev, 1/6) shifted by i_prev.
  // We track P(i) = probability of having i matches after the roll (given prior i_prev).
  // Start: roll 5 dice; pick face = argmax(count). i = max count.
  // Distribution of "max count" after rolling 5 fair dice:
  const initDist = computeMaxCountDist(5);
  let dist = initDist.slice(); // dist[i] = P(currently have i matches), i ∈ 0..5
  for (let r=1; r<N; r++){
    const next = [0,0,0,0,0,0];
    for (let i=0;i<=5;i++){
      if (!dist[i]) continue;
      // Reroll 5-i dice; each has prob 1/6 of matching.
      const rerollCount = 5 - i;
      for (let g=0; g<=rerollCount; g++){
        const p = binomial(rerollCount, g) * Math.pow(1/6, g) * Math.pow(5/6, rerollCount - g);
        next[i + g] += dist[i] * p;
      }
    }
    dist = next;
  }
  return dist[5];
}

const _maxCountDistCache = new Map();
function computeMaxCountDist(n){
  // Probability of "max count of any face" being k across n fair dice.
  if (_maxCountDistCache.has(n)) return _maxCountDistCache.get(n);
  // Enumerate all 6^n outcomes when n is small.
  const total = Math.pow(6, n);
  const dist = [0,0,0,0,0,0];
  for (let x=0; x<total; x++){
    const cs = [0,0,0,0,0,0,0];
    let v = x;
    for (let i=0;i<n;i++){ cs[(v%6)+1]++; v = Math.floor(v/6); }
    let maxC = 0;
    for (let f=1;f<=6;f++) if (cs[f]>maxC) maxC = cs[f];
    dist[maxC] += 1/total;
  }
  _maxCountDistCache.set(n, dist);
  return dist;
}

function binomial(n, k){
  if (k<0||k>n) return 0;
  if (k===0||k===n) return 1;
  let v = 1;
  for (let i=0;i<k;i++) v = v * (n-i) / (i+1);
  return v;
}

/* ---------------------------------------------------------------------
 * Stats visualization: hero "best move" + per-category cards.
 * Per category, we surface the most meaningful single metric:
 *   - Yahtzee/FH/SS/LS (binary outcome): large % chance + reward value
 *   - Upper / 3K / 4K (variable value): big EV + P(non-zero) sub-bar
 *   - Exact (no rolls remaining): the deterministic score
 * --------------------------------------------------------------------- */

const _BINARY_CATS = new Set(["yahtzee","full","small","large"]);

function statsBestMoveHtml(results){
  if (results.length === 0) return "";
  // Score each option with a heuristic: weight EV by category rarity so we
  // prefer locking down hard-to-fill categories when probability is decent.
  const rarity = {yahtzee:2.0, large:1.7, small:1.5, full:1.4, four:1.2, three:1.1};
  const ranked = results.map(r => ({
    r, score: r.ev * (rarity[r.cat.key] || 1.0),
  })).sort((a,b) => b.score - a.score);
  const top = ranked[0].r;
  const reasoning = (() => {
    if (top.exact) return "deterministic — locked in";
    if (_BINARY_CATS.has(top.cat.key)){
      const fv = fullValueFor(top.cat.key);
      const p = (top.modeProb && top.modeVal === fv) ? top.modeProb : top.pNonzero;
      return `${(p*100).toFixed(0)}% chance · ${fv} pts`;
    }
    return `EV ${top.ev.toFixed(1)} · ${(top.pNonzero*100).toFixed(0)}% non-zero`;
  })();

  return `
    <div class="best-move">
      <div class="bm-label">Best move</div>
      <div class="bm-cat">${top.cat.name}</div>
      <div class="bm-reason">${reasoning}</div>
    </div>`;
}

// Single per-category card.

function rollOne(){ return 1 + Math.floor(Math.random()*6); }

/* MC fallback for kinds/straights/full-house — but with locks RESPECTED.
 * locked[i] = true means dice[i] is held and never rerolled. */
function simulateLocked(catKey, dice, locked, rollsLeft, player){
  const d = dice.slice();
  // First, fill any empty unlocked slots (zeros) with a fresh roll.
  for (let i=0;i<5;i++) if (!locked[i] && d[i] === 0) d[i] = rollOne();
  // Now run rerolls. Strategy decides which non-locked dice to keep.
  let r = rollsLeft;
  while (r > 0){
    const strategicMask = keepStrategy(catKey, d, r);
    // Force-keep all locked dice
    for (let i=0;i<5;i++) if (locked[i]) strategicMask[i] = true;
    const allHeld = strategicMask.every(Boolean);
    if (allHeld) break;
    for (let i=0;i<5;i++) if (!strategicMask[i]) d[i] = rollOne();
    r--;
  }
  return scoreFor(catKey, d, player);
}

// Strategy unchanged but simpler: highest-count face, drop everything else.
function keepStrategy(catKey, dice, rollsLeft){
  const mask = [false,false,false,false,false];
  const c = counts(dice);
  switch(catKey){
    case "ones": case "twos": case "threes": case "fours": case "fives": case "sixes":{
      const target = {ones:1,twos:2,threes:3,fours:4,fives:5,sixes:6}[catKey];
      for (let i=0;i<5;i++) if (dice[i] === target) mask[i] = true;
      return mask;
    }
    case "yahtzee":{
      let bestFace = 1, bestCount = 0;
      for (let f=6; f>=1; f--) if (c[f] > bestCount){ bestCount = c[f]; bestFace = f; }
      for (let i=0;i<5;i++) if (dice[i] === bestFace) mask[i] = true;
      return mask;
    }
    case "three": case "four":{
      let bestFace = 0, bestCount = 0;
      for (let f=6; f>=1; f--){
        if (c[f] > bestCount){ bestCount = c[f]; bestFace = f; }
      }
      const need = catKey === "three" ? 3 : 4;
      const haveKind = bestCount >= need;
      for (let i=0;i<5;i++){
        if (dice[i] === bestFace) mask[i] = true;
        else if (haveKind){
          if (dice[i] >= 5) mask[i] = true;
          else if (rollsLeft <= 1 && dice[i] >= 4) mask[i] = true;
        }
      }
      // No pair yet, no rolls advantage: keep top die only
      if (bestCount < 2 && !haveKind){
        for (let i=0;i<5;i++) mask[i] = false;
        let bi = 0;
        for (let i=1;i<5;i++) if (dice[i] > dice[bi]) bi = i;
        mask[bi] = true;
      }
      return mask;
    }
    case "full":{
      const order = [1,2,3,4,5,6].sort((a,b) => (c[b] - c[a]) || (b - a));
      const kept = {};
      kept[order[0]] = Math.min(3, c[order[0]]);
      kept[order[1]] = Math.min(2, c[order[1]]);
      const used = {};
      for (let i=0;i<5;i++){
        const v = dice[i];
        if (kept[v] && (used[v]||0) < kept[v]){ mask[i] = true; used[v] = (used[v]||0)+1; }
      }
      return mask;
    }
    case "small": case "large":{
      const need = catKey === "large" ? 5 : 4;
      let bestWindow = 1, bestCovered = -1;
      for (let start=1; start <= 7 - need; start++){
        let covered = 0;
        for (let f=start; f<start+need; f++) if (c[f] > 0) covered++;
        if (covered > bestCovered){ bestCovered = covered; bestWindow = start; }
      }
      const seen = new Set();
      for (let i=0;i<5;i++){
        const v = dice[i];
        if (v >= bestWindow && v < bestWindow + need && !seen.has(v)){
          mask[i] = true; seen.add(v);
        }
      }
      return mask;
    }
    case "chance":{
      // Optimal threshold by rolls remaining (computed via chanceEvPerDie):
      //  k=2: keep ≥5 (E[reroll k=1] ≈ 4.667 < 5)
      //  k=1: keep ≥5 (E[reroll k=0] = 3.5 < 5)
      const t = rollsLeft >= 1 ? 5 : 7;
      for (let i=0;i<5;i++) if (dice[i] >= t) mask[i] = true;
      return mask;
    }
  }
  return mask;
}

/* =====================================================================
 * Main EV computation. Locked dice (any non-zero entry) never reroll.
 * Closed-form for: upper section, chance, yahtzee, exact deterministic.
 * MC for: 3K, 4K, full, small, large.
 * ===================================================================== */
/* For category `c`, return distribution map {value -> probability}.
 * Skips Chance (continuous-ish, low signal). Returns null for unsupported. */
function computeDistribution(c, dice, rollsLeft, player){
  if (c.key === "chance") return null;
  const lockedDice = dice.filter(d => d > 0);
  const heldCount = lockedDice.length;
  const rollCount = 5 - heldCount;
  // Deterministic only when no further rerolls can change the dice:
  //   - rolls remaining is 0, OR
  //   - all 5 dice are typed AND rolls remaining is 0
  // With all 5 dice typed + rolls remaining > 0, the player can still reroll
  // any subset under the strategy, so we run the full simulation.
  const noChange = rollsLeft === 0;

  // Deterministic case — exact outcome
  if (noChange){
    const v = scoreFor(c.key, dice, player);
    return {[v]: 1};
  }

  // Closed-form: upper section.
  // Strategy: keep all dice equal to target, reroll the rest. Typed non-target
  // dice are NOT locked — they'll be rerolled by the strategy.
  // After roll 0 (current state): we have c[target] target-matches.
  // For each non-matching die, P(becomes target after `rollsLeft` rerolls)
  //   = 1 - (5/6)^rollsLeft.
  // Empty slots: same probability (an empty slot first gets rolled once at
  // the start, but this initial fill counts as the same: P(target) = 1/6.
  // Then it can be rerolled `rollsLeft - 1`? No — the model is that after
  // `rollsLeft` rerolls, each die has had at most `rollsLeft + 1` rolls.
  // Simplification: an empty slot has not been rolled yet, so it gets
  // `rollsLeft + 1` chances (one initial roll + `rollsLeft` rerolls).
  // A typed-non-matching die has had 1 roll already and gets `rollsLeft` more.
  // P(match after k attempts) = 1 - (5/6)^k.
  if (UPPER_KEYS.includes(c.key)){
    const target = {ones:1,twos:2,threes:3,fours:4,fives:5,sixes:6}[c.key];
    const heldMatching = lockedDice.filter(d => d === target).length;
    const heldNonMatch = heldCount - heldMatching;
    const empty = 5 - heldCount;
    const pTyped = pMatchInRolls(rollsLeft);     // typed non-match → match
    const pEmpty = pMatchInRolls(rollsLeft + 1); // empty → match
    // Compute distribution of total matches via convolution of two binomials.
    const dist = {};
    for (let kT=0; kT<=heldNonMatch; kT++){
      const pT = binomial(heldNonMatch, kT) * Math.pow(pTyped, kT) * Math.pow(1-pTyped, heldNonMatch-kT);
      for (let kE=0; kE<=empty; kE++){
        const pE = binomial(empty, kE) * Math.pow(pEmpty, kE) * Math.pow(1-pEmpty, empty-kE);
        const score = (heldMatching + kT + kE) * target;
        dist[score] = (dist[score] || 0) + pT * pE;
      }
    }
    return dist;
  }

  // Closed-form: Yahtzee — only two outcomes (50 or 0)
  if (c.key === "yahtzee"){
    const p = pYahtzeeFromState(dice, rollsLeft);
    return {0: 1 - p, 50: p};
  }

  // Closed-form: Full House / Small Straight / Large Straight (binary outcome)
  if (c.key === "full" || c.key === "small" || c.key === "large"){
    const v = fullValueFor(c.key);
    const p = mcProbability(c.key, dice, rollsLeft, player, (s) => s === v);
    return {0: 1 - p, [v]: p};
  }

  // 3K / 4K — distribution over the actual sum totals.
  // Use MC and bucket the resulting scores. Typed dice are the current
  // roll (strategy may reroll them); empty slots are randomly filled
  // for the first simulated step.
  if (c.key === "three" || c.key === "four"){
    return mcDistribution(c.key, dice, rollsLeft, player);
  }
  return null;
}

// MC: typed dice are the current roll state (strategy may reroll any).
// Empty slots get rolled once at the start. `rollsLeft` rerolls follow.
const _NO_LOCK = [false, false, false, false, false];
function mcDistribution(catKey, dice, rollsLeft, player){
  const counts = {};
  for (let t=0; t<STATS_TRIALS; t++){
    const s = simulateLocked(catKey, dice, _NO_LOCK, rollsLeft, player);
    counts[s] = (counts[s] || 0) + 1;
  }
  const dist = {};
  for (const k in counts) dist[k] = counts[k] / STATS_TRIALS;
  return dist;
}

function mcProbability(catKey, dice, rollsLeft, player, predicate){
  let hits = 0;
  for (let t=0; t<STATS_TRIALS; t++){
    const s = simulateLocked(catKey, dice, _NO_LOCK, rollsLeft, player);
    if (predicate(s)) hits++;
  }
  return hits / STATS_TRIALS;
}

function computeStats(player, dice, rollsLeft){
  const eligible = CATEGORIES.filter(c => player.scores[c.key] === null && c.key !== "chance");
  const heldCount = dice.filter(d => d > 0).length;
  const noChange = rollsLeft === 0;

  const results = [];
  for (const c of eligible){
    const dist = computeDistribution(c, dice, rollsLeft, player);
    if (!dist) continue;
    // Compute summary stats from the distribution.
    let ev = 0, pNonzero = 0, modeVal = 0, modeProb = 0;
    for (const k in dist){
      const v = +k, p = dist[k];
      ev += v * p;
      if (v > 0) pNonzero += p;
      if (p > modeProb){ modeProb = p; modeVal = v; }
    }
    results.push({
      cat: c, dist, ev, pNonzero, modeVal, modeProb,
      exact: noChange,
    });
  }
  return results;
}

function fullValueFor(catKey){
  switch(catKey){
    case "full": return 25;
    case "small": return 30;
    case "large": return 40;
    case "yahtzee": return 50;
    default: return null; // upper section + three/four/chance: variable
  }
}
